name: Sync Meta Pixel Stats

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if META_PIXEL_TOKEN is configured
        id: check
        env:
          META_TOKEN: ${{ secrets.META_PIXEL_TOKEN }}
        run: |
          if [ -z "$META_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "META_PIXEL_TOKEN secret not set; keeping existing docs/stats.json"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Meta Pixel & GitHub Release totals
        if: steps.check.outputs.has_token == 'true'
        env:
          META_TOKEN: ${{ secrets.META_PIXEL_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - << 'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone

          meta_token = os.environ["META_TOKEN"]
          gh_token = os.environ["GH_TOKEN"]

          totals = {}
          url = "https://graph.facebook.com/v21.0/1683790373120460/stats?aggregation=event&start_time=2026-11-14T00:00:00&limit=500"
          while url:
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {meta_token}"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  res = json.loads(r.read().decode())
              for b in res.get("data", []):
                  for ev in b.get("data", []):
                      totals[ev["value"]] = totals.get(ev["value"], 0) + int(ev["count"])
              url = res.get("paging", {}).get("next")

          gh_req = urllib.request.Request(
              "https://api.github.com/repos/djsusmith/hyperstream-android/releases?per_page=100",
              headers={"Authorization": f"Bearer {gh_token}", "Accept": "application/vnd.github.v3+json"},
          )
          gh_total = 0
          with urllib.request.urlopen(gh_req, timeout=20) as r:
              for rel in json.loads(r.read().decode()):
                  for a in rel.get("assets", []):
                      gh_total += int(a.get("download_count", 0))

          stats = {
              "updated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "meta_leads": totals.get("Lead", 121),
              "meta_app_opens": totals.get("AppOpen", 85),
              "meta_page_views": totals.get("PageView", 422),
              "github_baseline": gh_total,
          }
          with open("docs/stats.json", "w") as f:
              json.dump(stats, f, indent=2)
              f.write("\n")
          print("Updated stats:", stats)
          PY

      - name: Commit and push updated stats
        if: steps.check.outputs.has_token == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stats.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(stats): sync Meta Pixel download totals"
          git push origin HEAD:main
          git push origin HEAD:feat/hyperstream-android
