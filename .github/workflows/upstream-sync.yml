name: Upstream Sync (Stable & Nightly Bug-Fix Channels)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Upstream anefzaoui/misterdownloadmanager
        id: check_upstream
        run: |
          OLD_SHA=$(python3 -c 'import json; print(json.load(open("upstream/UPSTREAM_VERSION.json"))["commit"])')
          OLD_VER=$(python3 -c 'import json; print(json.load(open("upstream/UPSTREAM_VERSION.json"))["version"])')
          bash scripts/sync-upstream.sh --remote
          NEW_SHA=$(python3 -c 'import json; print(json.load(open("upstream/UPSTREAM_VERSION.json"))["commit"])')
          NEW_VER=$(python3 -c 'import json; print(json.load(open("upstream/UPSTREAM_VERSION.json"))["version"])')
          APP_VER=$(python3 -c 'import re; m=re.search(r"versionName\s*=\s*\"([^\"]+)\"", open("android/app/build.gradle.kts").read()); print(m.group(1) if m else "0.6.4")')
          SHORT_SHA="${NEW_SHA:0:7}"
          echo "old_sha=$OLD_SHA" >> "$GITHUB_OUTPUT"
          echo "new_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "old_ver=$OLD_VER" >> "$GITHUB_OUTPUT"
          echo "new_ver=$NEW_VER" >> "$GITHUB_OUTPUT"
          echo "app_ver=$APP_VER" >> "$GITHUB_OUTPUT"
          if [[ "$OLD_SHA" != "$NEW_SHA" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        if: steps.check_upstream.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Rust & Cross-Compile libmdm_android.so (arm64-v8a)
        if: steps.check_upstream.outputs.changed == 'true'
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
          cargo test --manifest-path upstream/Cargo.toml -p mdm-android-ffi
          (cd upstream && CARGO_PROFILE_RELEASE_DEBUG=0 CARGO_PROFILE_RELEASE_STRIP=symbols cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs build --release -p mdm-android-ffi)

      - name: Set up Gradle
        if: steps.check_upstream.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Run Gradle Release Build
        if: steps.check_upstream.outputs.changed == 'true'
        run: |
          gradle -p android :app:testDebugUnitTest :app:assembleRelease
          cp android/app/build/outputs/apk/release/*.apk HyperStream-v${{ steps.check_upstream.outputs.app_ver }}-nightly-${{ steps.check_upstream.outputs.short_sha }}-arm64.apk

      - name: Commit Upstream Sync to main
        if: steps.check_upstream.outputs.changed == 'true' && steps.check_upstream.outputs.old_sha != steps.check_upstream.outputs.new_sha
        run: |
          git config user.name "HyperStream Upstream Sync Bot"
          git config user.email "actions@github.com"
          git add upstream/UPSTREAM_VERSION.json upstream/Cargo.toml upstream/i18n/
          git diff --cached --quiet || git commit -m "chore(upstream): sync anefzaoui/misterdownloadmanager @ ${{ steps.check_upstream.outputs.new_sha }}"
          git pull --rebase origin main
          git push origin HEAD:main
          git push --force-with-lease origin HEAD:feat/hyperstream-android || true

      - name: Publish Nightly / Bug-Fix Channel Release
        if: steps.check_upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes || true
          gh release create nightly HyperStream-v${{ steps.check_upstream.outputs.app_ver }}-nightly-${{ steps.check_upstream.outputs.short_sha }}-arm64.apk \
            --title "HyperStream v${{ steps.check_upstream.outputs.app_ver }} Nightly (Upstream ${{ steps.check_upstream.outputs.short_sha }})" \
            --notes "Automated nightly build for HyperStream v${{ steps.check_upstream.outputs.app_ver }} synced with upstream engine anefzaoui/misterdownloadmanager commit ${{ steps.check_upstream.outputs.new_sha }} (engine v${{ steps.check_upstream.outputs.new_ver }})." \
            --prerelease
