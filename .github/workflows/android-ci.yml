name: HyperStream Android CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Rust 1.98+ (nightly/beta) & Android NDK target
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
          rustup target add aarch64-linux-android

      - name: Verify Upstream Sync Script
        run: bash scripts/test-sync-upstream.sh

      - name: Run Rust JNI Bridge Unit Tests
        run: cargo test --manifest-path upstream/Cargo.toml -p mdm-android-ffi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Unit Tests & Assemble Release APK
        run: |
          gradle -p android :app:testDebugUnitTest :app:assembleRelease

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperStream-arm64-apk
          path: android/app/build/outputs/apk/release/*.apk
